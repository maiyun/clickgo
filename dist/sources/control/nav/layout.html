<div class="wrap" :class="[layer && 'layer', showData && 'show', (slots['menu-header'] || slots['menu-footer']) && 'chrome']">
    <div class="bg">
        <div class="bg-item bg-item-1"></div>
        <div class="bg-item bg-item-2"></div>
        <div class="bg-item bg-item-3"></div>
        <div class="bg-item bg-item-4"></div>
    </div>
    <!-- 左侧 -->
    <div class="menuwrap" @click="menuwrapClick">
        <!-- 新插槽独立于菜单滚动区，旧用法保留原有结构 -->
        <div v-if="slots['menu-header'] || slots['menu-footer']" class="menu-panel">
            <div v-if="slots['menu-header']" class="menu-header">
                <slot name="menu-header"></slot>
            </div>
            <cg-flow ref="flow" class="menu" direction="v">
                <div v-if="logoData" class="logo" :style="{'background-image': logoData}">
                    <slot name="slogo"></slot>
                </div>
                <slot></slot>
            </cg-flow>
            <div v-if="slots['menu-footer']" class="menu-footer">
                <slot name="menu-footer"></slot>
            </div>
        </div>
        <cg-flow v-else ref="flow" class="menu" direction="v">
            <div v-if="logoData" class="logo" :style="{'background-image': logoData}">
                <slot name="slogo"></slot>
            </div>
            <slot></slot>
        </cg-flow>
    </div>
    <!-- 右侧 -->
    <div class="content">
        <div class="header">
            <div class="mbutton" @click="showData=!showData;emit('update:show',showData)">
                <svg viewBox="0 0 24 24" stroke="none"><path d="m4.25 8c0-.41421.33579-.75.75-.75h14c.4142 0 .75.33579.75.75s-.3358.75-.75.75h-14c-.41421 0-.75-.33579-.75-.75zm0 4c0-.4142.33579-.75.75-.75h14c.4142 0 .75.3358.75.75s-.3358.75-.75.75h-14c-.41421 0-.75-.3358-.75-.75zm.75 3.25c-.41421 0-.75.3358-.75.75s.33579.75.75.75h14c.4142 0 .75-.3358.75-.75s-.3358-.75-.75-.75z" /></svg>
            </div>
            <slot name="header"></slot>
        </div>
        <div class="body">
            <slot name="content"></slot>
        </div>
    </div>
</div>
