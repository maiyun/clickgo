<div class="wrap" :class="[propBoolean('plain')&&'plain']" :data-cg-disabled="propBoolean('disabled') ? '' : undefined">
    <div class="header">
        <div class="left">
            <cg-select :data="years" v-model="vyear" virtual></cg-select>
            <cg-button class="monthleft" :disabled="prevYm < startYm" @click="prev">
                <div class="arrow"></div>
            </cg-button>
            <cg-select :data="months" v-model="vmonth" virtual></cg-select>
            <cg-button class="monthright" :disabled="nextYm > endYm" @click="next">
                <div class="arrow"></div>
            </cg-button>
        </div>
        <div class="right">
            <cg-check :modelValue="monthMaps.some(item => valueSet.has(item))" :indeterminate="monthMaps.some(item => valueSet.has(item)) && !monthMaps.every(item => valueSet.has(item))" @changed="monthCheckChanged">{{l('whole month')}}</cg-check>
            <cg-button v-if="propBoolean('clearbtn') && values.length" @click="clear">{{l('clear')}}</cg-button>
            <cg-button v-if="propBoolean('backbtn') && (dateValue.year !== '0') && ((dateValue.year !== vyear[0]) || (dateValue.month !== vmonth[0]))" @click="back">{{l('back')}}</cg-button>
            <cg-button @click="today">{{l('today')}}</cg-button>
        </div>
    </div>
    <div class="week">
        <div v-if="slots['left']"></div>
        <div v-for="col of 7">
            <cg-check :modelValue="weekMaps[col - 1] && weekMaps[col - 1].some(item => valueSet.has(item))" :indeterminate="weekMaps[col - 1] && weekMaps[col - 1].some(item => valueSet.has(item)) && !weekMaps[col - 1].every(item => valueSet.has(item))" @changed="weekCheckChanged($event, col - 1)">{{l('w' + (col - 1))}}</cg-check>
        </div>
    </div>
    <div class="row" v-for="row, index of maps">
        <div v-if="slots['left']" class="col-left">
            <slot name="left" :row="row" :index="index"></slot>
        </div>
        <div class="col" v-for="col of row" :style="{'color': col.month !== vmonth[0] ? 'var(--g-color-disabled)' : undefined}" :class="[{'selected': (dateValue.year !== '0') && (dateValue.year === col.year) && (dateValue.month === col.month) && (dateValue.date === col.date), 'mselected': valueSet.has(col.value)}]" @click="colClick(col)" :data-cg-disabled="isDisabled(col)">
            <button v-if="(col.month === vmonth[0]) && (isDisabled(col) === undefined)" type="button" class="day-check" :class="[valueSet.has(col.value) && 'checked']" :aria-pressed="valueSet.has(col.value) ? 'true' : 'false'" :tabindex="formFocus && !propBoolean('disabled') ? 0 : -1" @click="checkClick($event, col)">
                <svg viewBox="0 0 24 24" stroke="none"><path d="m19.7732 6.25699c.3024.34265.3024.8982 0 1.24086l-8.1328 9.21715c-1.5117 1.7133-3.96265 1.7133-5.47436.0001l-1.93928-2.1979c-.30235-.3427-.30235-.8982 0-1.2409.30234-.3426.79253-.3426 1.09487 0l1.93928 2.1979c.90703 1.028 2.3776 1.028 3.28459 0l8.1329-9.21721c.3023-.34265.7925-.34265 1.0948 0z" /></svg>
            </button>
            <div class="colh">{{col.date}}</div>
            <div class="colb" v-if="slots['default']">
                <slot :year="col.year" :month="col.month" :date="col.date" :day="col.day" :value="col.value"></slot>
            </div>
        </div>
    </div>
</div>
