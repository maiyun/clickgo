<div class="wrap" :class="['bg-' + bg, {compact: compact}]" role="group" :aria-label="label || undefined">
    <cg-panzoom ref="view" class="view" :content-width="scene.width" :content-height="scene.height" zoom-min="0.05" zoom-max="2" :disabled="disabled">
        <div class="scene" :style="{width: scene.width + 'px', height: scene.height + 'px'}">
            <svg class="links" :width="scene.width" :height="scene.height" aria-hidden="true">
                <g v-for="(edge, index) in scene.edges" :key="index + ':' + edge.path + ':' + edge.animation + ':' + edge.direction + ':' + edge.duration + ':' + edge.dotCount" :class="['status-' + (edge.status || 'default'), {flow: edge.animation === 'dash', duplex: edge.direction === 'both', emphasis: selected === edge.source || selected === edge.target}]" :style="{'--flow-duration': edge.duration + 's'}">
                    <path class="line" :class="{reverse: edge.direction === 'reverse'}" :d="edge.path" fill="none" vector-effect="non-scaling-stroke"></path>
                    <path v-if="edge.animation === 'dash' &amp;&amp; edge.direction === 'both'" class="line reverse counterpart" :d="edge.path" fill="none" vector-effect="non-scaling-stroke"></path>
                    <g v-if="edge.animation === 'dots'" class="packets">
                        <g v-for="reverse in (edge.direction === 'both' ? [false, true] : [edge.direction === 'reverse'])" :key="reverse ? 'reverse' : 'forward'">
                            <circle v-for="dot in edge.dotCount" :key="dot" class="packet" r="2.5">
                                <animateMotion :path="edge.path" :dur="edge.duration + 's'" :begin="-((dot - 1 + (reverse ? .5 : 0)) / edge.dotCount) * edge.duration + 's'" :keyPoints="reverse ? '1;0' : '0;1'" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"></animateMotion>
                            </circle>
                        </g>
                    </g>
                    <text v-if="edge.label" :x="edge.x" :y="edge.y - 8" text-anchor="middle">{{edge.label}}</text>
                </g>
            </svg>
            <div ref="nodes" class="nodes"><slot></slot></div>
        </div>
    </cg-panzoom>
    <div v-if="!scene.nodes.length" class="empty"><slot name="empty">{{l('empty')}}</slot></div>
    <div class="tools" @pointerdown.stop @wheel.stop>
        <cg-button type="tool" :tip="l('out')" :disabled="disabled" @click="zoom(1 / 1.2)">−</cg-button>
        <cg-button type="tool" :tip="l('in')" :disabled="disabled" @click="zoom(1.2)">+</cg-button>
        <cg-button type="tool" :disabled="disabled" @click="fit">{{l('fit')}}</cg-button>
    </div>
</div>
