<div class="wrap" :class="[isExpanded ? 'expanded' : 'collapsed', isFloating && 'floating', isFloating && floatPosition, isCollapsed && 'group-collapsed', canGrow && 'grow']">
    <!-- 展开模式标签栏 -->
    <div v-if="isExpanded" class="tabs" role="tablist">
        <div v-for="item of items" :key="item.name" class="tab" :class="[selectedData === item.name && 'selected']" role="tab" :aria-selected="selectedData === item.name" :tabindex="formFocus ? '0' : undefined" @click="select(item.name)" @keydown="activateKeydown($event, item.name)">{{item.label}}</div>
        <div v-if="canCollapse" class="collapse-btn" role="button" :aria-expanded="!isCollapsed" :aria-label="items.find(item => item.name === selectedData)?.label" :tabindex="formFocus ? '0' : undefined" @click.stop="toggleCollapsed" @keydown="activateKeydown($event)">
            <svg :class="[isCollapsed && 'collapsed']" viewBox="0 0 24 24" stroke="none"><path d="m8.46967 3.46967c.29289-.29289.76777-.29289 1.06066 0l8.00007 8.00003c.2929.2929.2929.7677 0 1.0606l-8.00007 8.0001c-.29289.2929-.76777.2929-1.06066 0-.29289-.2929-.29289-.7678 0-1.0607l7.46963-7.4697-7.46963-7.46967c-.29289-.29289-.29289-.76777 0-1.06066z" /></svg>
        </div>
    </div>
    <!-- 收起模式图标栏 -->
    <template v-if="!isExpanded">
        <cg-tip v-for="item of items" :key="item.name" :label="item.label" :direction="(floatPosition === 'left') !== (localeDirection === 'rtl') ? 'right' : 'left'" immediate>
            <div class="icon-btn" :class="[isFloating && selectedData === item.name && 'active']" role="button" :aria-label="item.label" :aria-expanded="isFloating && selectedData === item.name" :tabindex="formFocus ? '0' : undefined" @click="iconClick(item.name)" @keydown="activateKeydown($event, item.name, true)">
                <cg-svg v-if="item.icon && item.icon.endsWith('svg')" :src="item.icon" />
                <cg-img v-else-if="item.icon" :src="item.icon" />
                <div v-else class="icon-text">{{item.label.slice(0, 1)}}</div>
            </div>
        </cg-tip>
    </template>
    <!-- 选中内容区 -->
    <div ref="content" class="content" :style="floatStyle">
        <div v-if="!isExpanded && isFloating" class="float-tabs" role="tablist">
            <div v-for="item of items" :key="item.name" class="float-tab" :class="[selectedData === item.name && 'selected']" role="tab" :aria-selected="selectedData === item.name" :tabindex="formFocus ? '0' : undefined" @click="select(item.name)" @keydown="activateKeydown($event, item.name)">{{item.label}}</div>
        </div>
        <cg-flow class="panel" direction="v">
            <slot></slot>
        </cg-flow>
    </div>
</div>
