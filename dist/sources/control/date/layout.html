<div class="wrap" :data-cg-disabled="propBoolean('disabled') ? '' : undefined">
    <div class="first">
        <div @click="click('first')" ref="first" v-if="showDate || showTime">
            <template v-if="timestamp === undefined">
                <div>{{l('please click select')}}</div>
            </template>
            <template v-else>
                <div v-if="showDate">{{dateStr}}</div>
                <div v-if="showTime">{{timeStr}}</div>
            </template>
        </div>
        <div v-if="propBoolean('zone')" @click="click('zone')" ref="zone">UTC{{tzData >= 0 ? '+' : ''}}{{tzData}}</div>
    </div>
    <button v-if="propBoolean('close') && timestamp !== undefined" class="clear" type="button" :disabled="propBoolean('disabled')" :tabindex="formFocus ? 0 : -1" :aria-label="l('clear')" @pointerdown.stop @click.stop="clear" @keydown.stop @keyup.stop>
        <cg-icon name="close" size="m"></cg-icon>
    </button>
    <teleport v-if="showDate" to="system">
        <div ref="firstpop" class="pop">
            <cg-datepanel v-if="datePanelMounted" :mode="mode" :disabled="disabled" plain :tz="tzData" :yearmonth="yearmonth" :hourminute="hourminute" @update:yearmonth="emit('update:yearmonth', $event)" @yearmonthchanged="emit('yearmonthchanged')" :clearbtn="false" :time="showTime" :start="start" :end="end" v-model="timestamp" @changed="changed" @selected="selected" :disabledList="disabledList">
                <template v-if="slots['default']" v-slot="col">
                    <slot :year="col.year" :month="col.month" :date="col.date" :day="col.day" :str="col.str" :time="col.time"></slot>
                </template>
            </cg-datepanel>
        </div>
    </teleport>
    <teleport v-if="!showDate && showTime" to="system">
        <div ref="timepop" class="pop list">
            <div>
                <div class="item">
                    <div class="title">{{l('hour')}}</div>
                    <cg-list :data="hours" v-model="vhour" virtual></cg-list>
                </div>
                <div class="item">
                    <div class="title">{{l('minute')}}</div>
                    <cg-list :data="minutes" v-model="vminute" virtual></cg-list>
                </div>
                <div class="item">
                    <div class="title">{{l('second')}}</div>
                    <cg-list :data="seconds" v-model="vseconds" virtual></cg-list>
                </div>
            </div>
            <div>
                <cg-button @click="cancel">{{l('cancel')}}</cg-button>
                <cg-button @click="timeOk">{{l('ok')}}</cg-button>
            </div>
        </div>
    </teleport>
    <teleport v-if="propBoolean('zone')" to="system">
        <div ref="zonepop" class="pop list">
            <div>
                <div class="item">
                    <div class="title">{{l('zone')}}</div>
                    <cg-list :data="zones" v-model="vzone" virtual></cg-list>
                </div>
                <div class="item">
                    <div class="title">{{l('minute')}}</div>
                    <cg-list :data="zdecs" v-model="vzdec" virtual></cg-list>
                </div>
            </div>
            <div>
                <cg-button @click="cancel">{{l('cancel')}}</cg-button>
                <cg-button @click="zoneOk">{{l('ok')}}</cg-button>
            </div>
        </div>
    </teleport>
</div>
